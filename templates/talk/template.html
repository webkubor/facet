<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      {{styles}}
    </style>
  </head>
  <body class="talk">
    <main class="talk-stage">{{slides}}</main>

    <div class="talk-progress"><span id="talk-pos">1</span><span> / </span><span id="talk-total">1</span></div>
    <div class="talk-bar"><i id="talk-bar-fill"></i></div>

    <script>
      (function () {
        var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
        var pos = 0;
        var posEl = document.getElementById("talk-pos");
        var totalEl = document.getElementById("talk-total");
        var fillEl = document.getElementById("talk-bar-fill");

        function show(next) {
          if (!slides.length) return;
          pos = Math.max(0, Math.min(slides.length - 1, next));
          slides.forEach(function (s, i) {
            s.classList.toggle("active", i === pos);
          });
          if (posEl) posEl.textContent = String(pos + 1);
          if (totalEl) totalEl.textContent = String(slides.length);
          if (fillEl) fillEl.style.width = ((pos + 1) / slides.length * 100) + "%";
          window.scrollTo(0, 0);
        }

        document.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); show(pos + 1); }
          else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(pos - 1); }
          else if (e.key === "Home") { show(0); }
          else if (e.key === "End") { show(slides.length - 1); }
          else if (/^[0-9]$/.test(e.key)) { show(Number(e.key) - 1); }
          else if (e.key === "f" || e.key === "F") {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen();
          }
        });

        document.querySelectorAll("[data-slide]").forEach(function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            show(Number(a.getAttribute("data-slide")));
          });
        });

        // 大屏自适应：以 1280×800 为基准，按视口等比缩放内容（含超大屏/投影）。
        function fitScale() {
          var scale = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
          scale = Math.max(0.5, Math.min(3, scale));
          document.documentElement.style.setProperty("--talk-scale", String(scale));
        }
        window.addEventListener("resize", fitScale);
        fitScale();

        show(0);
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      {{styles}}
    </style>
  </head>
  <body class="template-{{template}}">
    <div class="share-banner share-banner-top">
      <strong>{{shareHeader}}</strong>
      <span>{{role}} · {{location}}</span>
    </div>
    <main class="resume-shell">
      {{body}}
    </main>
    <div class="share-banner share-banner-bottom">
      <strong>{{shareFooter}}</strong>
      <span>{{author}} · {{date}}</span>
    </div>
  </body>
</html>
